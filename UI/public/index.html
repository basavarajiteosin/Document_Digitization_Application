  .inputGroupCustom {
    background-color: #fff;
    display: block;
    margin: 6px 0;
    position: relative;
    padding-right: 10px;
    padding-left: 0px;
  }

  .inputGroupCustom label {
    padding: 11px 20px;
    width: 100%;
    display: block;
    text-align: left;
    color: #3c454c;
    cursor: pointer;
    position: relative;
    z-index: 2;
    transition: color 200ms ease-in;
    overflow: hidden;
    background: #eaeaea;
    font-size: small;
    margin-bottom: 0px;
  }

  .inputGroupCustom label:before {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    content: "";
    background-color: #4977a5;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale3d(1, 1, 1);
    transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    z-index: -1;
  }

  .inputGroupCustom label:after {
    background-image: url("data:image/svg+xml,%3Csvg width='32' height='32' viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5.414 11L4 12.414l5.414 5.414L20.828 6.414 19.414 5l-10 10z' fill='%23fff' fill-rule='nonzero'/%3E%3C/svg%3E ");
    width: 26px;
    height: 26px;
    content: "";
    border: 2px solid #d1d7dc;
    background-color: #fff;

    background-repeat: no-repeat;
    background-position: -1px 1px;
    border-radius: 50%;
    z-index: 2;
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    transition: all 200ms ease-in;
  }

  .inputGroupCustom input:checked~label {
    color: #fff;
  }

  .inputGroupCustom input:checked~label:before {
    transform: translate(-50%, -50%) scale3d(56, 56, 1);
    opacity: 1;
  }

  .inputGroupCustom input:checked~label:after {
    background-color: #1f2d3d;
    border-color: #1f2d3d;
  }

  .inputGroupCustom input {
    width: 32px;
    height: 32px;
    order: 1;
    z-index: 2;
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    visibility: hidden;
  }

  .search-row {

  <script>
    let select2Values = [];
    $(document).on(
      "change keyup paste ",
      "input,textarea,select",
      function () {
        if ($(this).hasClass("is-invalid")) {
          $(this).removeClass("is-invalid");
        }
      }
    );

    $(document).on("change", ".select2", function () {
      select2Values = $(this).val();
    });

    function getSelect2Values() {
      return select2Values;
    }

    function initSummernoteFuncation() {
      $(document).ready(function () {
        setTimeout(() => {
          $("#summernote").summernote({ height: 200, focus: true });
        }, 1000);
      });
    }

    function initMultiSelectFuncation() {
      $(document).ready(function () {
        setTimeout(() => {
          $(".select2").select2();
        }, 1000);
      });
    }

    function getSummerNoteValueFuncation() {
      return $("#summernote").summernote("code");
    }

    function getClearSummerNoteValueFuncation() {
      $("#summernote").summernote("reset");
    }

    function setSummerNoteValueFuncation(getTest) {
      $("#summernote").summernote("code", getTest);
    }

    function assignValueToSelect2(getArrayValues) {
      $(".select2").val(getArrayValues).change();
      select2Values = getArrayValues;
    }

    function initDatePickerFuncation() {
      $(document).ready(function () {
        setTimeout(() => {
          $("#projectStartDate").datetimepicker({
            format: "DD-MM-YYYY",
          });
          $("#projectEndDate").datetimepicker({
            format: "DD-MM-YYYY",
          });
          $("#projectKickOffDate").datetimepicker({
            format: "DD-MM-YYYY",
          });
          $("#inputDateOfBirthV").datetimepicker({
            format: "DD-MM-YYYY",
          });
          $("#joiningDateV").datetimepicker({
            format: "DD-MM-YYYY",
          });

          $("#projectStartDateV").datetimepicker({
            format: "DD-MM-YYYY",
          });

          if ($.fn.dataTable.isDataTable("#example1")) {
          } else {
            $("#example1")
              .DataTable({
                responsive: true,
                lengthChange: false,
                autoWidth: false,
                buttons: ["copy", "csv", "excel", "pdf", "print", "colvis"],
              })
              .buttons()
              .container()
              .appendTo("#example1_wrapper .col-md-6:eq(0)");
          }
        }, 2000);
      });
    }

    $(document).on("click", ".toggle-password", function () {
      $(this).toggleClass("fa-eye fa-eye-slash");
      var input = $($(this).attr("toggle"));
      if (input.attr("type") == "password") {
        input.attr("type", "text");
      } else {
        input.attr("type", "password");
      }
    });

    function initDateTimePickerFuncation() {
      $(document).ready(function () {
        $("#projectStartDate, #projectEndDate").on("blur", function (e) {
          $(this).datetimepicker("hide");
        });

        setTimeout(() => {
          $("#projectStartDate").datetimepicker({
            icons: { time: "far fa-clock" },
            format: "DD/MM/YYYY hh:mm A",
            autoclose: true,
            keepOpen: false,
          });
          $("#projectEndDate").datetimepicker({
            icons: { time: "far fa-clock" },
            format: "DD/MM/YYYY hh:mm A",
            autoclose: true,
          });

          if ($.fn.dataTable.isDataTable("#example1")) {
          } else {
            $("#example1")
              .DataTable({
                responsive: {
                  details: {
                    renderer: DataTable.Responsive.renderer.listHiddenNodes(),
                  },
                },
                lengthChange: false,
                autoWidth: false,
                buttons: ["copy", "csv", "excel", "pdf", "print", "colvis"],
              })
              .buttons()
              .container()
              .appendTo("#example1_wrapper .col-md-6:eq(0)");
          }
        }, 1500);
      });
    }
    function initDestroyDataTableFuncation() {
      $(document).ready(function () {
        if ($.fn.dataTable.isDataTable("#example1")) {
          var table = $("#example1").DataTable();
          table.destroy();
        }
      });
    }

    function initDestroyDataTableFuncationForManagerList() {
      $(document).ready(function () {
        if ($.fn.dataTable.isDataTable("#example1")) {
          var table = $("#example1").DataTable();
          table.clear().destroy();
        }
      });
    }

    function initDataTableFuncation() {
      $(document).ready(function () {
        if ($.fn.dataTable.isDataTable("#example1")) {
        } else {
          $("#example1")
            .DataTable({
              responsive: {
                details: {
                  renderer: DataTable.Responsive.renderer.listHiddenNodes(),
                },
              },
              lengthChange: false,
              autoWidth: false,
              buttons: ["copy", "csv", "excel", "pdf", "print", "colvis"],
            })
            .buttons()
            .container()
            .appendTo("#example1_wrapper .col-md-6:eq(0)");
        }
      });
    }

    function initDataTableReportFunction() {
      $(document).ready(function () {
        if ($.fn.dataTable.isDataTable("#example2")) {
          $("#example2").DataTable().draw();
        } else {
          var table = $("#example2")
            .DataTable({
              responsive: false,
              lengthChange: false,
              autoWidth: true,
              scrollX: true,
              buttons: [
                "copy",
                "csv",
                {
                  extend: "excel",
                  exportOptions: {
                    columns: ":visible",
                  },
                },
                "pdf",
                "print",
                "colvis",
              ],
              lengthMenu: [
                [5, 10, 25, 50, -1],
                [5, 10, 25, 50, "All"],
              ],
              pageLength: 5,
              initComplete: function () {
                var api = this.api();

                $("#search-row .form-control").each(function (index) {
                  var input = $(this);
                  var column = api.column(index);

                  input.addClass("form-control form-control-sm");

                  input.on("keyup change", function () {
                    column.search(this.value).draw();
                    toggleCancelIcon(input);
                  });

                  var cancelButton = $(
                    '<span class="search-cancel-icon" style="cursor: pointer;">&times;</span>'
                  )
                    .appendTo(input.parent())
                    .on("click", function () {
                      input.val("");
                      column.search("").draw();
                      toggleCancelIcon(input);
                    });

                  cancelButton.css({
                    "font-size": "16px",
                    color: "#aaa",
                    "line-height": "1",
                    position: "absolute",
                    right: "10px",
                    top: "50%",
                    transform: "translateY(-50%)",
                  });
                });

                function toggleCancelIcon(input) {
                  var cancelButton = input
                    .parent()
                    .find(".search-cancel-icon");
                  if (input.val().trim() !== "") {
                    cancelButton.css("color", "#FF0000");
                  } else {
                    cancelButton.css("color", "#aaa");
                  }
                }
              },
              columnDefs: [
                { orderable: true, targets: 0 },
                { orderable: false, targets: -1 },
                { orderable: true, targets: "_all" },
              ],
              order: [[0, "asc"]],
            })
            .buttons()
            .container()
            .appendTo("#example2_wrapper .col-md-6:eq(0)");
        }
      });
    }

                function toggleCancelIcon(input) {
                  var cancelButton = input

                { orderable: false, targets: -1 },
                { orderable: true, targets: "_all" },
              ],
              order: [[0, "asc"]],
            })
            .buttons()
            .container()
            .appendTo("#example3_wrapper .col-md-6:eq(0)");
        }
      });
    }

    function confirmModalShow() {
      $("#confirmCommonModal").modal("show");
    }

      $("#confirmCommonModal").modal("hide");

    function importExcelContactsShow() {
      $("#importExcelModal").modal("show");
    }
    function importExcelContactsHide() {
      $("#importExcelModal").modal("hide");
    }

    function scroller() {
      var scroll = $("div.scroll");

      var height = scroll.height();

      var topAdj = -height - 30;
      scroll.animate(
        {
          top: [topAdj, "linear"],
        },
        33000,
        function () {
          scroll.css("top", 80);
          scroller();
        }
      );
    }

    function initScroller() {
      scroller();
    }
  </script>
