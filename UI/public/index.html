<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/bmslogowipro.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#106ebe" />
  <meta name="description" content="Document Digitization Application" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/fvg.svg" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <link rel="stylesheet" href="%PUBLIC_URL%/plugins/fontawesome-free/css/all.min.css" />
  <link rel="stylesheet" href="%PUBLIC_URL%/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css" />
  <link rel="stylesheet" href="%PUBLIC_URL%/plugins/datatables-responsive/css/responsive.bootstrap4.min.css" />
  <link rel="stylesheet" href="%PUBLIC_URL%/plugins/datatables-buttons/css/buttons.bootstrap4.min.css" />
  <link rel="stylesheet" href="%PUBLIC_URL%/dist/css/adminlte.min.css" />
  <link rel="stylesheet" href="%PUBLIC_URL%/plugins/summernote/summernote-bs4.min.css" />
  <link rel="stylesheet" href="%PUBLIC_URL%/dist/css/custom.css" />

  <title>Document Digitization</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script src="%PUBLIC_URL%/plugins/jquery/jquery.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/datatables/jquery.dataTables.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/datatables-responsive/js/dataTables.responsive.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/datatables-responsive/js/responsive.bootstrap4.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/datatables-buttons/js/dataTables.buttons.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/datatables-buttons/js/buttons.bootstrap4.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/jszip/jszip.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/pdfmake/pdfmake.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/pdfmake/vfs_fonts.js"></script>
  <script src="%PUBLIC_URL%/plugins/datatables-buttons/js/buttons.html5.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/datatables-buttons/js/buttons.print.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/datatables-buttons/js/buttons.colVis.min.js"></script>
  <script src="%PUBLIC_URL%/plugins/summernote/summernote-bs4.min.js"></script>
  <script src="%PUBLIC_URL%/dist/js/adminlte.js"></script>

  <script>
    // clear red validation state as soon as the user edits a field
    $(document).on("change keyup paste", "input,textarea,select", function () {
      if ($(this).hasClass("is-invalid")) $(this).removeClass("is-invalid");
    });

    // password show/hide icon
    $(document).on("click", ".toggle-password", function () {
      $(this).toggleClass("fa-eye fa-eye-slash");
      var input = $($(this).attr("toggle"));
      input.attr("type", input.attr("type") === "password" ? "text" : "password");
    });

    // email template editor (EmailConfiguration)
    function initSummernoteFuncation() {
      setTimeout(function () { $("#summernote").summernote({ height: 200, focus: true }); }, 1000);
    }
    function getSummerNoteValueFuncation() { return $("#summernote").summernote("code"); }
    function setSummerNoteValueFuncation(html) { $("#summernote").summernote("code", html); }

    // DataTables used by the master / user / role lists (#example1)
    function initDestroyDataTableFuncation() {
      if ($.fn.dataTable.isDataTable("#example1")) { $("#example1").DataTable().destroy(); }
    }
    function initDataTableFuncation() {
      if ($.fn.dataTable.isDataTable("#example1")) return;
      $("#example1")
        .DataTable({
          responsive: { details: { renderer: DataTable.Responsive.renderer.listHiddenNodes() } },
          lengthChange: false,
          autoWidth: false,
          buttons: ["copy", "csv", "excel", "pdf", "print", "colvis"],
        })
        .buttons()
        .container()
        .appendTo("#example1_wrapper .col-md-6:eq(0)");
    }

    // bootstrap confirm dialog
    function confirmModalShow() { $("#confirmCommonModal").modal("show"); }
    function confirmModalHide() { $("#confirmCommonModal").modal("hide"); }
  </script>
</body>
</html>
